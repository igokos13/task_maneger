<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>TaskManager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Список задач:</h1>
    <p><a href="{{ url_for('create') }}">Создать задачу</a></p>
    <div class="table-wrapper">
        <table>
        <thead><tr><th>Название</th><th>Категория</th><th>Приоритет</th><th>Статус</th></tr></thead>
        <tbody>
          {% for task in tasks %}
            <tr>
              <td><a href="{{ url_for('detail', task_id=task.id) }}">{{ task.title }}</a></a></td>
              <td>{{ task.category_name }}</td>
              <td>{{ task.priority_name }}</td>
              <td>{{ task.status_name }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
</body>
</html>
