<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Категории</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>Категории</h1>
  <p><a href="{{ url_for('tasks_bp.index') }}">К списку задач</a></p>
  <p><a href="{{ url_for('categories_bp.create') }}">Создать категорию</a></p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <div class="table-wrapper">
    <table>
      <thead><tr><th>Название</th><th>Действия</th></tr></thead>
      <tbody>
        {% for category in categories %}
          <tr>
            <td>{{ category.name }}</td>
            <td>
              <a href="{{ url_for('categories_bp.edit', category_id=category.id) }}">Редактировать</a>
              <form action="{{ url_for('categories_bp.delete', category_id=category.id) }}" method="post"
                    onsubmit="return confirm('Удалить категорию?');">
                <button type="submit">Удалить</button>
              </form>
            </td>
          </tr>
        {% else %}
          <tr><td colspan="2">Категорий пока нет.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
